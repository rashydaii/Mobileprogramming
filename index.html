<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Hellbound MC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>CONTACT US</h1>
    
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      
      <button type="submit">SEND MESSAGE</button>
    </form>

    <div id="status"></div>

    <div class="contacts-list">
      <h2>Recent Messages</h2>
      <div id="contactsList"></div>-
    </div>
  </div>

  <!-- Firebase SDK from CDN - COMPAT VERSION -->
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-analytics-compat.js"></script>

  <!-- Contact Manager Module -->
  <script src="Contact.js"></script>

  <!-- Initialize Firebase and Form -->
  <script>
    // Wait for DOM to be ready
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM loaded, initializing contact form...');
      // Initialize the contact form with Firebase
      contactManager.initializeContactForm();
      console.log('Contact form initialized!');
    });
  </script>
</body>
</html>
