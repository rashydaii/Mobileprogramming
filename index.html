<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Groups and Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="group1">
        <div id="box1" class="box1">This is text of group 1</div>
        <div class="box2">Group 1</div>
        <button onclick="changeFontSize()">Change Font Size</button>
    </div>

    <div id="group2">
        <div id="box3" class="box3">Group 2</div>
        <div class="box4">Group 2</div>
        <button onclick="changeStyle()">Change Style</button>
    </div>

    <div id="group3">
        <div id="box5" class="box5">Group 3</div>
        <div class="box6">Group 3</div>
        <button onclick="changeImage()">Change Image</button>
    </div>

    <div id="group4">
        <div id="box7" class="box7">Group 4</div>
        <div class="box8">Group 4</div>
        <button onclick="addText()">Change Text</button>
    </div>

    <div id="group5">
        <div id="result"></div>
        <button onclick="displaySum()">Display Sum</button>
        <button onclick="displaySubtraction()">Display Subtraction</button>
        <button onclick="displayMultiplication()">Display Multiplication</button>
        <button onclick="displayDivision()">Display Division</button>
    </div>

    <script src="script.js"></script>
    <script src="calculator.js"></script>
</body>
</html>
