<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Hellbound MC</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a1a;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #ff0000;
      margin-bottom: 30px;
      font-size: 32px;
    }
    form {
      background-color: #333;
      padding: 30px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #fff;
    }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #555;
      border-radius: 5px;
      background-color: #444;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #ff0000;
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
    }
    textarea {
      min-height: 150px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #ff0000;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #cc0000;
    }
    button:active {
      transform: scale(0.98);
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    #status.success {
      background-color: #4CAF50;
      color: #fff;
      display: block;
    }
    #status.error {
      background-color: #f44336;
      color: #fff;
      display: block;
    }
    .contacts-list {
      margin-top: 40px;
    }
    .contacts-list h2 {
      color: #ff0000;
      margin-bottom: 20px;
    }
    .contact-item {
      background-color: #333;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
      border-left: 4px solid #ff0000;
    }
    .contact-item h3 {
      color: #ff0000;
      margin-bottom: 5px;
    }
    .contact-item p {
      margin: 5px 0;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CONTACT US</h1>
    
    <form id="contactForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>
      </div>
      
      <button type="submit">SEND MESSAGE</button>
    </form>

    <div id="status"></div>

    <div class="contacts-list">
      <h2>Recent Messages</h2>
      <div id="contactsList"></div>
    </div>
  </div>

  <!-- Firebase SDK from CDN - Compat version for global firebase object -->
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-analytics-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCxPMwQbp3Krwpn5-Y05kFikpzGgzC9K84",
      authDomain: "hellbound-mc.firebaseapp.com",
      projectId: "hellbound-mc",
      storageBucket: "hellbound-mc.firebasestorage.app",
      messagingSenderId: "122527408194",
      appId: "1:122527408194:web:2a5230da25f65a9c1f0ddb",
      measurementId: "G-8K5GK4ZZFL",
      databaseURL: "https://hellbound-mc-default-rtdb.firebaseio.com"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const analytics = firebase.analytics();
    const database = firebase.database();

    const contactForm = document.getElementById('contactForm');
    const statusDiv = document.getElementById('status');
    const contactsList = document.getElementById('contactsList');

    // Handle form submission
    contactForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      console.log('Form submitted with:', { name, email, message });

      // Add contact to Realtime Database
      const contactsRef = firebase.database().ref('contacts');
      const newContactRef = contactsRef.push();
      
      console.log('Pushing to Firebase...', contactsRef.toString());

      newContactRef.set({
        name: name,
        email: email,
        message: message,
        timestamp: new Date().toISOString()
      }).then(() => {
        console.log('✓ Data saved successfully!');
        statusDiv.textContent = '✓ Message sent successfully!';
        statusDiv.className = 'success';
        statusDiv.style.display = 'block';
        contactForm.reset();
        
        setTimeout(() => {
          statusDiv.style.display = 'none';
        }, 3000);
      }).catch((error) => {
        console.error('✗ Error saving data:', error);
        statusDiv.textContent = '✗ Failed to send message: ' + error.message;
        statusDiv.className = 'error';
        statusDiv.style.display = 'block';
      });
    });

    // Listen to contacts in real-time
    firebase.database().ref('contacts').on('value', (snapshot) => {
      contactsList.innerHTML = '';
      const data = snapshot.val();

      if (!data) {
        contactsList.innerHTML = '<p style="color: #999;">No messages yet.</p>';
        return;
      }

      const contactsArray = [];
      snapshot.forEach((childSnapshot) => {
        contactsArray.push({
          id: childSnapshot.key,
          ...childSnapshot.val()
        });
      });

      // Display newest first
      contactsArray.reverse().forEach(contact => {
        const contactDiv = document.createElement('div');
        contactDiv.className = 'contact-item';
        
        const date = new Date(contact.timestamp);
        const formattedDate = date.toLocaleString();
        
        contactDiv.innerHTML = `
          <h3>${contact.name}</h3>
          <p><strong>Email:</strong> ${contact.email}</p>
          <p><strong>Message:</strong> ${contact.message}</p>
          <p style="color: #666; font-size: 12px;">Sent: ${formattedDate}</p>
        `;
        contactsList.appendChild(contactDiv);
      });
    });
  </script>
</body>
</html>
